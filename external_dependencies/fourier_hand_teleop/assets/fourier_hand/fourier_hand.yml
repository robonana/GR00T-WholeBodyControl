  # for DexPilot type
  wrist_link_name: "R_hand_base_link"
  finger_tip_link_names: [ "R_thumb_tip_link", "R_index_tip_link", "R_middle_tip_link", "R_ring_tip_link", "R_pinky_tip_link" ]

  # Scaling factor: robot_size / human_size ≈ 0.137 / 0.18 ≈ 0.76
  scaling_factor: 1.3
  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
